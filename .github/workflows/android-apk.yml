name: Build Study Companion APK

on:
  workflow_dispatch:
  push:
    paths:
      - "package.json"
      - "capacitor.config.json"
      - "android-icons.zip"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Capacitor
        run: npm install

      - name: Prepare web directory
        run: |
          mkdir -p www
          printf '%s\n' \
            '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head><body>Opening Study Companion...</body></html>' \
            > www/index.html

      - name: Create Android project
        run: npx cap add android

      - name: Install open-book app icons
        run: |
          test -f android-icons.zip
          unzip -o android-icons.zip -d /tmp/study-icons
          cp -R /tmp/study-icons/res/. android/app/src/main/res/

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
    working-directory: android
    run: |
      chmod +x gradlew
      ./gradlew assembleDebug
      echo "=== DEBUG CERTIFICATE SHA-1 ==="
      keytool -list -v \
        -keystore "$HOME/.android/debug.keystore" \
        -alias androiddebugkey \
        -storepass android \
        -keypass android | grep -E "SHA1:|SHA256:"

      - name: Save APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: study-companion-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
