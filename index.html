<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Companion - TS SCERT Textbooks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Spectral:ital,wght@0,500;0,600;0,700;1,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #2A231C;
            --sub: #A876E1;
            --cream: #FEDD8C;
            --card: #FFFFFF;
            --line: #E7D8C4;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: var(--cream);
            color: var(--ink);
            font-family: 'Manrope', sans-serif;
        }

        .app {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
            padding-bottom: 84px;
        }

        .eyebrow {
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--sub);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 22px 18px 0;
        }

        .logo {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background-color: #C1432E;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFF;
            font-size: 20px;
            flex-shrink: 0;
        }

        .hero {
            margin: 20px 18px;
            background: linear-gradient(135deg, #3A3A2B, #4E4DD3);
            padding: 22px;
            border-radius: 18px;
        }

        .hero h1 {
            font-family: 'Space Mono', monospace;
            font-size: 10.5pt;
            letter-spacing: 1.5px;
            color: #D94A6A;
            text-transform: uppercase;
            margin: 0;
        }

        .hero h2 {
            font-family: 'Spectral', serif;
            font-weight: 600;
            font-size: 22px;
            margin: 6px 0 0;
            color: #FEDD8C;
            line-height: 1.5;
        }

        .tags {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .tag-pill {
            font-family: 'Manrope', sans-serif;
            font-size: 11px;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.6);
            padding: 3px 9px;
            border-radius: 999px;
            color: var(--ink);
        }

        .book-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            background: #FFF;
            border-radius: 10px;
            margin: 0 18px 12px;
            border: 1px solid var(--line);
        }

        .book-title {
            font-family: 'Spectral', serif;
            font-weight: 600;
            font-size: 14.5px;
            margin: 0;
        }

        .book-sub {
            font-size: 12px;
            color: var(--sub);
            margin-top: 2px;
        }

        .pdf-overlay {
            position: fixed;
            inset: 0;
            background: #171B26;
            z-index: 60;
            display: flex;
            flex-direction: column;
        }

        .pdf-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: var(--card);
            border-bottom: 1px solid var(--line);
            gap: 8px;
            flex-wrap: wrap;
        }

        .pdf-title {
            font-family: 'Spectral', serif;
            font-weight: 600;
            font-size: 13px;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 80px;
        }

        .pdf-frame-wrap {
            position: relative;
            flex: 1;
        }

        .pdf-frame {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .tool-row {
            display: flex;
            gap: 6px;
            padding: 6px 12px;
            background: var(--card);
            border-top: 1px solid var(--line);
            align-items: center;
        }

        .tool-btn {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: #FFF;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--ink);
        }

        .tool-btn.active {
            background: var(--ink);
            color: var(--cream);
            border-color: var(--ink);
        }

        .saved-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 0 18px;
        }

        .saved-card {
            display: flex;
            align-items: center;
            gap: 12px;
            border-radius: 10px;
            background: #FFF;
            border: 1px solid var(--line);
            padding: 14px;
            text-align: left;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="logo">📚</div>
            <div>
                <span class="eyebrow">Study Companion</span>
            </div>
        </header>

        <section class="hero">
            <h1>TS SCERT Textbooks</h1>
            <h2>Classroom Resources & Guides</h2>
            <div class="tags">
                <span class="tag-pill">Class 1-10</span>
                <span class="tag-pill">All Subjects</span>
            </div>
        </section>

        <main class="saved-list">
            <div class="saved-card">
                <div>
                    <div class="book-title">Mathematics - Class 10</div>
                    <div class="book-sub">English Medium • Telangana State Board</div>
                </div>
            </div>
            <div class="saved-card">
                <div>
                    <div class="book-title">Physical Science - Class 10</div>
                    <div class="book-sub">English Medium • Telangana State Board</div>
                </div>
            </div>
            <div class="saved-card">
                <div>
                    <div class="book-title">Biological Science - Class 10</div>
                    <div class="book-sub">English Medium • Telangana State Board</div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
